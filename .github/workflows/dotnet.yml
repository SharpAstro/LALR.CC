name: dotnet

# CI/CD for LALR.CC.
#
# Triggers:
#   - push to master       → restore/build/test, pack, upload nupkg+snupkg as
#                            artifact (no publish)
#   - push to tag "v*"     → same as master, plus publish to NuGet using
#                            NUGET_API_KEY (the SharpAstro org-level secret
#                            with NuGet.org push permissions; needs to be
#                            granted to this repo under the org's secret
#                            "Repositories with access" list)
#   - pull_request → master → restore/build/test only (no pack, no publish),
#                            except a same-repo PR labelled "preview": that
#                            also packs and publishes SharpAstro.LALR.CC to
#                            NuGet as the prerelease
#                            <Major>.<Minor>.<Patch+1>-pr<N>.<run>.<attempt>
#
# Conventions:
#   - We pack from the runtime project only; it bundles the source generator +
#     YamlDotNet in analyzers/dotnet/cs/ inside the nupkg.
#   - GITHUB_ACTIONS=true switches Directory.Build.props to deterministic-path
#     mode (ContinuousIntegrationBuild=true), so packages are bit-reproducible
#     given the same source.
#   - The runtime <Version> drives the package version. Tag should match the
#     csproj Version (e.g. v2.0.0 ↔ <Version>2.0.0</Version>); a guard step
#     fails the publish job if they diverge.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
    # Listing types replaces the default set, so the defaults are spelled out. 'labeled' is the
    # addition: labelling an already open PR 'preview' must start a run. A labeled run for any other
    # label is skipped by the build job's if:, so labels that pilot toggles on a PR that already
    # carries 'preview' do not rebuild it or publish another permanent prerelease.
    types: [opened, synchronize, reopened, labeled]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'preview'
    # One run per PR at a time: opened and labeled(preview) fire together, and a push during a
    # build replaces it, so only the newest builds (and publishes). Keyed by run id for a push or
    # tag, and cancel-in-progress only for a pull_request, so a master or tag build is never
    # cancelled. The cancel only ever hits this job, never a publish job mid-push.
    concurrency:
      group: build-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # One preview condition: a pull_request whose PR carries the 'preview' label and whose head
      # branch lives in THIS repository (a fork PR gets no secrets and must not try).
      IS_PREVIEW: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview') && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so SourceLink can resolve commits and pdb metadata.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Preview version
        # Preview form: <Major>.<Minor>.<Patch+1>-pr<N>.<run>.<attempt>, computed from the csproj
        # <Version> (a flight never edits it). It sorts above the current release (a prerelease of
        # the next patch) and below whatever release comes next, so a consumer's pin only moves
        # forward; the dot-separated numeric identifiers order by run, then attempt. Passed as
        # -p:Version only, so FileVersion stays X.Y.Z.0 (a prerelease tag is illegal there).
        # Event values come in through env:, never interpolated into the script.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          VERSION_ARGS=""
          if [ "$IS_PREVIEW" = "true" ]; then
            csproj_version=$(grep -oP '<Version>\K[^<]+' LALR.CC/LALR.CC.csproj)
            if ! printf '%s' "$csproj_version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::csproj <Version> is not digits.digits.digits (got '$csproj_version')"
              exit 1
            fi
            case "$PR_NUMBER" in
              ''|*[!0-9]*) echo "::error::preview build without a numeric pull request number (got '$PR_NUMBER')"; exit 1 ;;
            esac
            IFS=. read -r major minor patch <<< "$csproj_version"
            version="${major}.${minor}.$((10#$patch + 1))-pr${PR_NUMBER}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            VERSION_ARGS="-p:Version=${version}"
            echo "Preview version: $version"
            echo "Preview package: SharpAstro.LALR.CC $version" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "VERSION_ARGS=${VERSION_ARGS}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore LALR.CC.sln

      - name: Build (Release)
        run: dotnet build LALR.CC.sln -c Release --no-restore --nologo $VERSION_ARGS

      - name: Test
        run: dotnet test LALR.CC.Tests/LALR.CC.Tests.csproj -c Release --no-build --nologo

      # Stage parity check — stage0 (inline grammar) and stage1 (YAML pipeline)
      # must produce byte-identical Accept output. If they diverge, something
      # in the YAML/schema/generator stack regressed and stage0 is the truth.
      - name: Stage0 vs Stage1 Accept parity
        run: |
          diff \
            <(dotnet run --project Bootstrap/Bootstrap.csproj --no-build -c Release \
                | grep -oE '^Accept.*' | sed 's/^Accept ([^)]*): /Accept: /') \
            <(dotnet run --project Bootstrap.Stage1/Bootstrap.Stage1.csproj --no-build -c Release \
                | grep -oE '^Accept.*' | sed 's/^Accept ([^)]*): /Accept: /')

      - name: Pack
        if: github.event_name == 'push' || env.IS_PREVIEW == 'true'
        run: dotnet pack LALR.CC/LALR.CC.csproj -c Release --no-build --nologo -o packages $VERSION_ARGS

      - name: Upload package artifacts
        if: github.event_name == 'push' || env.IS_PREVIEW == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            packages/*.nupkg
            packages/*.snupkg
          if-no-files-found: error

  publish:
    needs: build
    # Only publish on tag push. Master pushes upload artifacts but don't
    # publish — gives us an audit trail of "what would have shipped" without
    # spamming NuGet.org with every commit.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches csproj Version
        # Belt and braces: catches a tag pushed without bumping <Version> in the
        # csproj. The package would still build but ship under the old version,
        # which is confusing for consumers.
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          csproj_version=$(grep -oP '<Version>\K[^<]+' LALR.CC/LALR.CC.csproj)
          if [ "$tag" != "$csproj_version" ]; then
            echo "::error::Tag v$tag does not match csproj <Version>$csproj_version</Version>"
            exit 1
          fi
          echo "Tag and csproj version both at $tag — OK"

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: packages

      - name: Push to NuGet
        # --skip-duplicate makes re-runs of the same tag idempotent. The .snupkg
        # alongside is auto-routed to symbols.nuget.org by NuGet.org. Pushing
        # the *.nupkg glob picks both up.
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # Preview packages. Opt-in by the 'preview' label because nuget.org prereleases are permanent
  # (unlist, never delete). Only for a PR whose head branch is in this repository: a fork PR gets
  # no secrets and must not try. The tag publish job cannot fire on a pull_request, so nothing is
  # pushed twice. --skip-duplicate makes a re-run of the same run and attempt harmless.
  publish-preview:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview') && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: packages

      - name: Push preview to NuGet
        # The key goes in through env:, so it is never part of the script text.
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
